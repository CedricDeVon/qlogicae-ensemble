[project]
name = "${{ qlogicae-logis-base-brand-name }}"
version = "${{ qlogicae-logis-current-version-number }}"
description = "${{ qlogicae-logis-base-description }}"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "${{ main-author-full-name }}", email = "${{ main-author-base-email }}" }
]
maintainers = [
    { name = "${{ main-author-full-name }}", email = "${{ main-author-base-email }}" }
]
keywords = ["${{ main-company-base-name }}", "${{ qlogicae-logis-base-project-name }}"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Software Distribution",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    # "pydantic>=2.13,<3",
    # "pyfiglet>=1.0.4,<2",
    # "PyYAML>=6.0,<7",
    # "qlogicae-cor>=1.0.8,<2",
    # "rich>=15,<16",
    # "textual>=8,<9",
    # "typer>=0.26,<1",
    # "tomli_w>=1.2.0,<2",
    # "tomlkit>=0.15.0,<1"
]


[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-benchmark",
    "ruff",
    "mypy",
    "hatch",
    "twine",
    "memray",
    "scalene",
    "pympler"
]

[project.scripts]
qlogicae-logis = "${{ qlogicae-logis-source-brand-name }}.v2.console.app:main"


[project.urls]
Homepage = "${{ qlogicae-logis-base-repository-link }}"
Repository = "${{ qlogicae-logis-base-repository-link }}"
Documentation = "${{ qlogicae-logis-base-repository-link }}"
Issues = "${{ qlogicae-logis-base-repository-link }}/issues"
Changelog = "${{ qlogicae-logis-base-repository-link }}/releases"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-ra"
# testpaths = ["./test/${{ qlogicae-logis-source-brand-name }}/v3/unit"]


[tool.coverage.run]
source = []
branch = true


[tool.hatch.build]
include = [
    "${{ qlogicae-logis-source-brand-name }}/**/*",
    "${{ qlogicae-logis-source-brand-name }}/py.typed",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "test",
    ".github",
    ".gitignore",
    ".vscode",
    "requirements.txt",
    "output",
    "docs/**",
    "project/**",
]

[tool.coverage.report]
show_missing = true
skip_covered = false


[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".output",
    "output",
    ".outputs",
    "outputs",
    ".dist",
    "dist",
    ".build",
    "build",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".tox",
    ".nox",
    ".idea",
    ".vscode",
    "qlogicae_logis/v3/_vendor",
]

[tool.ruff.lint]
select = [    
    "E",
    "W", # pycodestyle    
    "F", # Pyflakes    
    "I", # isort    
    "UP", # pyupgrade    
    "B", # flake8-bugbear
    "PTH", # pathlib
]
ignore = [        
    "E731",
    "B008",
    "S607",    
    "S101", # allow assert statements    
    "S603", # allow subprocess usage
    "PLR2004", # allow magic values
]
fixable = ["ALL"]
unfixable = []


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
skip-magic-trailing-comma = false

[tool.mypy]
files = [
    "${{ qlogicae-logis-source-brand-name }}/v3",
]
exclude = [
    '(^|/)_vendor(/|$)',
]
strict = true
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
show_error_codes = true
pretty = true
color_output = true
show_column_numbers = true
show_error_context = true

[[tool.mypy.overrides]]
module = [
    "${{ qlogicae-logis-source-brand-name }}.v3._vendor.*",
]
ignore_errors = true

[tool.hatch.build.targets.wheel]
packages = ["${{ qlogicae-logis-source-brand-name }}"]


[tool.hatch.build.targets.wheel.force-include]
"${{ qlogicae-logis-source-brand-name }}/py.typed" = "${{ qlogicae-logis-source-brand-name }}/py.typed"


[tool.hatch.envs.default.scripts]
minify = """
    pyminify \
        --in-place \
        --rename-globals \
        --remove-debug \
        --remove-asserts \
        --remove-literal-statements \
        ${{ qlogicae-logis-source-brand-name }}/v3
"""
test-lint = """
    ruff check ${{ qlogicae-logis-source-brand-name }}/v3/console ${{ qlogicae-logis-source-brand-name }}/v3/library --fix
"""
test-type-check = """
    mypy 
"""
test-unit = """
    pytest -vv \
        --cov \
        --cov-branch \
        --cov-report=term-missing \
        --cov-report=html:\"${{ qlogicae-logis-output-test-unit-filesystem-path }}/html\" \
        --cov-report=xml:\"${{ qlogicae-logis-output-test-unit-filesystem-path }}/coverage.xml\" \
        --cov-report=json:\"${{ qlogicae-logis-output-test-unit-filesystem-path }}/coverage.json\" \
        --junitxml=\"${{ qlogicae-logis-output-test-unit-filesystem-path }}/junit.xml\" \
"""
test-benchmark-memory-usage-create = """
    memray run -o ${{ qlogicae-logis-output-test-benchmark-filesystem-path }}/memray-1.bin -m test.${{ qlogicae-logis-source-brand-name }}.v2.benchmark.memory_usage.test_usage ;
"""
# memray run -o ${{ qlogicae-logis-output-test-benchmark-filesystem-path }}/memray-2.bin -m test.${{ qlogicae-logis-source-brand-name }}.v2.benchmark.memory_usage.test_dynamic
test-benchmark-memory-usage-view = """
    memray tree ${{ qlogicae-logis-output-test-benchmark-filesystem-path }}/memray-1.bin
"""
# memray tree ${{ qlogicae-logis-output-test-benchmark-filesystem-path }}/memray-2.bin
test-pip-deployment = """
    twine check --strict ${{ qlogicae-logis-output-build-release-filesystem-path }}/dist/*
"""
deploy = """
    twine upload ${{ qlogicae-logis-output-build-release-filesystem-path }}/dist/* --config-file .pypirc
"""

github-workflow-setup = """
    mkdir -p ${{ qlogicae-logis-output-build-release-filesystem-path }} &&
    mkdir -p ${{ qlogicae-logis-output-test-unit-filesystem-path }} &&
    mkdir -p ${{ qlogicae-logis-output-test-benchmark-filesystem-path }}
"""
github-workflow-test-type-check = """
    hatch run github-workflow-setup &&
    hatch run test-type-check
"""
github-workflow-test-lint = """
    hatch run github-workflow-setup &&
    hatch run test-lint
"""
github-workflow-test-unit = """
    hatch run github-workflow-setup &&
    hatch run test-unit
"""
github-workflow-test-benchmark-memory-usage-create = """
    hatch run github-workflow-setup &&
    hatch run test-benchmark-memory-usage-create
"""
github-workflow-test-benchmark-memory-usage-view = """
    hatch run github-workflow-setup &&
    hatch run test-benchmark-memory-usage-view
"""

# scalene run --html --outfile ${{ qlogicae-logis-output-test-benchmark-filesystem-path }}/scalene.html test/${{ qlogicae-logis-source-brand-name }}/v3/benchmark/memory_usage/test_static.py
# memray run -o ${{ qlogicae-logis-output-test-benchmark-filesystem-path }}/memray.bin -m test.${{ qlogicae-logis-source-brand-name }}.v2.benchmark.memory_usage.test_static
