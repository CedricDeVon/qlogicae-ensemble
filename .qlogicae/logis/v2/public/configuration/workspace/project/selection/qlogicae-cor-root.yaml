data:
  workspace:
    project:
      selection:
        qlogicae-cor-root:
          filesystem-path:
            value: ${{ selection-filesystem-path }}/qlogicae-cor

  # script:
  #   targets:      
  #     qlogicae-cor-deploy:
  #       enter-filesystem-path:
  #         value: ${{ selection-filesystem-path }}/qlogicae-cor
          
  #       commands:
  #         - run: git add .
  #         - run: git commit -m "deployment attempt"
  #         - run: git push
  #         - run: git push --tags

  macros:  
    file:
      targets:
        qlogicae-cor-display-brand-name:
          value: ${{ main-company-display-name }} ${{ qlogicae-cor-display-project-name }}

        qlogicae-cor-base-brand-name:
          value: ${{ main-company-base-name }}-${{ qlogicae-cor-base-project-name }}

        qlogicae-cor-source-brand-name:
          value: ${{ main-company-base-name }}_${{ qlogicae-cor-base-project-name }}

        qlogicae-cor-selection-project-filesystem-path:
          value: ${{ selection-filesystem-path }}/${{ qlogicae-cor-base-brand-name }}

        qlogicae-cor-display-project-name:
          value: Cor

        qlogicae-cor-base-project-name:
          value: cor

        qlogicae-cor-base-description:
          value: The core library for QLogicae projects

        qlogicae-cor-base-repository-link:
          value: https://github.com/CedricDeVon/qlogicae-cor

