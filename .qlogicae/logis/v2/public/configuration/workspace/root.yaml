data:
  workspace:
    is-enabled:
      value: true

  workflow:
    is-enabled:
      value: true

  command:
    cache:
      value-cache:
        hide:
          key-path:
            selection:
              targets:
                - key:
                    value: a.b.c

            pattern:
              targets:
                - value: api

    template:
      is-enabled:
        value: true

      cleanup:
        is-enabled:
          value: true

    filesystem:
      clean:
        is-enabled:
          value: true

        default:
          include:
            is-enabled:
              value: true

          exclude:
            is-enabled:
              value: true

        exclude:
          targets:
            - filesystem-path:
                value: ${{ root-filesystem-path }}/.venv

              os:
                selection:
                  linux:

            - filesystem-path:
                value: ${{ root-filesystem-path }}/.github
                
              pattern:        
                value: "**/*"

            - filesystem-path:
                value: ${{ root-filesystem-path }}/others

            - filesystem-path:
                value: ${{ root-filesystem-path }}/project

            - filesystem-path:
                value: ${{ root-filesystem-path }}/qlogicae_logis

        include:
          selection:
            root:
              alias:
                targets:
                  - name:
                      value: ql

              os:
                selection:
                  linux:

              targets:
                - filesystem-path:
                    value: ${{ root-filesystem-path }}/workspace/private/temporary

                  pattern:
                    value: "**"

    export:
      is-enabled:
        value: true

      cleanup:
        is-enabled:
          value: true

      asynchronous:
        is-enabled:
          value: true          

      default:
        filesystem:
          include:
            is-enabled:
              value: true

          exclude:
            is-enabled:
              value: true

        group:
          is-enabled:
            value: true

        selection:
          is-enabled:
            value: true

      group:
        group-1:
          is-enabled:
            value: true

          selection:
            workspace-1:

      selection:
        workspace-1:
          alias:
            targets:
              - name:
                  value: ql

          is-enabled:
            value: true

          input:    
            root-path:
              value: ${{ root-filesystem-path }}

            targets:
              - filesystem-path:
                  value: project.code-workspace            

          output:
            filesystem-path:
              value: ${{ root-filesystem-path }}

          compression:
            format:
              value: zip

            type:
              value: deflated

            level:
              value: 6

            is-zip-64-allowed:
              value: true

            is-timestamp-strict:
              value: true

  time:
    zone:
      value: local

  log:
    is-enabled:
      value: true
      override: false
      
    is-verbose: 
      value: true
      override: false

    default:
      file:
        output:
          is-enabled:
            value: True

    file:      
      is-enabled:
        value: true

      is-verbose: 
        value: true

      targets:
        # - filesystem-path: output.log

    console:
      is-enabled:
        value: true

      is-verbose: 
        value: true

  plugin:
    is-enabled:
      value: true
      override: false

    command:
      is-enabled:
        value: true

    macros:
      static:
        is-enabled:
          value: true

      dynamic:
        is-enabled:
          value: true

    import:
      targets:
        - filesystem-path:
            value: ...

    default:
      import:
        is-enabled:
          value: true

  macros:
    default:
      pre-parse:
        is-enabled:
          value: true

      on-parse:
        is-enabled:
          value: false

      value-cache:
        is-enabled:
          value: true

    value-cache:
      targets:

    file:
      targets:
        main-author-full-name:
          value: Vaughn Cedric L. Araneta

          alias:
            targets:
              - name:
                  value: author

        main-author-base-email:
          value: vaughncedriclipardoaraneta@gmail.com
        
        main-company-display-name:
          value: QLogicae

        main-company-base-name:
          value: qlogicae
        
        main-company-base-logo-filesystem-path:
          value: ./project/asset/${{ main-company-base-name }}1.png

    dynamic:
      targets:
        data: 

