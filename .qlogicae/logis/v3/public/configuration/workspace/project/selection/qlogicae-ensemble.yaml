workspace:
  project:
    selection:
      qlogicae-ensemble:
        filesystem-path:
          value: ${{ qlogicae-ensemble-selection-project-filesystem-path }}

workflow:
  is-enabled:
    value: true

  selection:      
    qlogicae-ensemble-synchronize:
      filesystem-path:
        value: ${{ root-filesystem-path }}
      
      scripts:
        - run:
            value: command-filesystem-copy          
          argument:
            source_paths:
              - ${{ root-filesystem-path }}/.qlogicae
            target_paths:
              - ${{ qlogicae-ensemble-selection-project-filesystem-path }}/.qlogicae

    qlogicae-ensemble-source:
      enter-filesystem-path:
        value: ${{ root-filesystem-path }}

      scripts:
        - run:
            value: command-template-apply
          argument:
            targets:
              - ${{ qlogicae-ensemble-brand-base-name }}

        - run:
            value: qlogicae-ensemble-synchronize

macros:  
  static:
    file:
      targets:
        qlogicae-ensemble-brand-display-name:
          value: ${{ main-company-display-name }} ${{ qlogicae-ensemble-project-display-name }}

        qlogicae-ensemble-brand-base-name:
          value: ${{ main-company-base-name }}-${{ qlogicae-ensemble-project-base-name }}

        qlogicae-ensemble-project-display-name:
          value: Ensemble

        qlogicae-ensemble-project-base-name:
          value: ensemble

        qlogicae-ensemble-project-base-description:
          value: The filesystem repository for QLogicae projects.

        qlogicae-ensemble-license-display-name:
          value: MIT

        qlogicae-ensemble-version-current-number:
          value: 1.2.0

        qlogicae-ensemble-version-current-label:
          value: v${{ qlogicae-ensemble-version-current-number }}

        qlogicae-ensemble-selection-project-filesystem-path:
          value: ${{ selection-filesystem-path }}/${{ qlogicae-ensemble-brand-base-name }}

        qlogicae-ensemble-design-system-link:
          value: https://www.figma.com/design/YhcYppMpUaCkXMJa7hfHHy/qlogicae-uizee?node-id=0-1&t=LS2uVICtbExmT75y-1

        qlogicae-ensemble-repository-link:
          value: .
