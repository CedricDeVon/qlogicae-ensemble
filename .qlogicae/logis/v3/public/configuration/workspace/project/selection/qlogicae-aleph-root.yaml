workspace:
  project:
    selection:
      qlogicae-aleph-root:
        filesystem-path:
          value: ${{ qlogicae-aleph-root-filesystem-path }}

workflow:
  selection:      
    qlogicae-aleph-stage-release:
      filesystem-path:
        value: ${{ qlogicae-aleph-root-filesystem-path }}
    
      scripts:
        - run:
            value: command-template-apply        
          argument:
            targets:
              - qlogicae-aleph

        - run:
            value: qlogicae-ensemble-synchronize-backups

macros:
  static:  
    file:
      targets:
        qlogicae-aleph-root-filesystem-path:
          value: ${{ selection-filesystem-path }}/${{ qlogicae-aleph-brand-base-name }}
