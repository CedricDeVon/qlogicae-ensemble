workspace:
  project:
    selection:
      qlogicae-pondux:
        filesystem-path:
          value: ${{ selection-filesystem-path }}/qlogicae-pondux

macros:
  static:  
    file:
      targets:
        qlogicae-pondux-display-brand-name:
          value: ${{ main-company-display-name }} ${{ qlogicae-pondux-display-project-name }}

        qlogicae-pondux-base-brand-name:
          value: ${{ main-company-base-name }}-${{ qlogicae-pondux-base-project-name }}

        qlogicae-pondux-display-project-name:
          value: Pondux

        qlogicae-pondux-base-project-name:
          value: pondux

        qlogicae-pondux-base-description:
          value: The cli for QLogicae projects

        qlogicae-pondux-current-version-number:
          value: 0.1.8

        qlogicae-pondux-current-version-label:
          value: v${{ qlogicae-pondux-current-version-number }}
