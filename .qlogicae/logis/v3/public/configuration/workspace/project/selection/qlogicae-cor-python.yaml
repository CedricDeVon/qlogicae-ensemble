workspace:
  project:
    selection:
      qlogicae-cor-python:
        filesystem-path:
          value: ${{ qlogicae-cor-python-filesystem-path }}

workflow:
  selection:      
    qlogicae-cor-python-stage:
      filesystem-path:
        value: ${{ qlogicae-cor-python-filesystem-path }}

      scripts:
        - run:
            value: qlogicae-cor-python-source

        - run:
            value: qlogicae-cor-python-test

        - run:
            value: qlogicae-cor-python-archive

    qlogicae-cor-python-source:
      filesystem-path:
        value: ${{ root-filesystem-path }}

      scripts:
        - run:
            value: command-template-apply        
          argument:
            targets:
              - qlogicae-cor

        - run:
            value: command-filesystem-clean-path
          argument:
            target_paths:
              - ${{ qlogicae-cor-python-filesystem-path }}/dist
              - ${{ qlogicae-cor-python-filesystem-path }}/output

        - run:
            value: command-filesystem-tree-setup          
          argument:
            target_paths:
              - ${{ qlogicae-cor-python-filesystem-path }}/archive
              - ${{ qlogicae-cor-python-filesystem-path }}/${{ qlogicae-cor-python-output-build-release-filesystem-path }}
              - ${{ qlogicae-cor-python-filesystem-path }}/${{ qlogicae-cor-python-output-test-unit-filesystem-path }}
              - ${{ qlogicae-cor-python-filesystem-path }}/${{ qlogicae-cor-python-output-test-benchmark-filesystem-path }}
                    
        - run:
            value: qlogicae-cor-python-build


    qlogicae-cor-python-build:
      filesystem-path:
        value: ${{ qlogicae-cor-python-filesystem-path }}
        
      scripts:
        - run:
            value: hatch build

        - run:
            value: command-filesystem-move       
          argument:
            source_path: dist
            target_path: ${{ qlogicae-cor-python-output-build-release-filesystem-path }}

    qlogicae-cor-python-test:
      filesystem-path:
        value: ${{ qlogicae-cor-python-filesystem-path }}
        
      scripts:
        - run:
            value: hatch run test-type-check

        - run:
            value: hatch run test-lint

        - run:
            value: hatch run test-unit        

        - run:
            value: hatch run test-pip-deployment

    qlogicae-cor-python-archive:
      filesystem-path:
        value: ${{ qlogicae-cor-python-filesystem-path }}

      scripts:          
        - run:
            value: command-filesystem-copy
          argument:
            source_paths:
              - output
            target_paths:
              - ${{ qlogicae-cor-python-archive-filesystem-path }}

    qlogicae-cor-python-deploy:
      filesystem-path:
        value: ${{ qlogicae-cor-python-filesystem-path }}
        
      scripts:
        - run:
            value: hatch run deploy

macros:  
  static:
    file:
      targets:
        qlogicae-cor-python-filesystem-path:
          value: ${{ qlogicae-cor-root-filesystem-path }}/python

        qlogicae-cor-python-version-current-number:
          value: 2.2.1

        qlogicae-cor-python-active-major-version-number:
          value: 2

        qlogicae-cor-python-version-current-label:
          value: python-v${{ qlogicae-cor-python-version-current-number }}

        qlogicae-cor-python-archive-filesystem-path:
          value: archive/${{ qlogicae-cor-python-version-current-label }}/${{ current-timestamp }}

        qlogicae-cor-python-output-filesystem-path:
          value: output

        qlogicae-cor-python-output-build-release-filesystem-path:
          value: ${{ qlogicae-cor-python-output-filesystem-path }}/build/release

        qlogicae-cor-python-output-test-unit-filesystem-path:
          value: ${{ qlogicae-cor-python-output-filesystem-path }}/test/unit

        qlogicae-cor-python-output-test-benchmark-filesystem-path:
          value: ${{ qlogicae-cor-python-output-filesystem-path }}/test/benchmark
