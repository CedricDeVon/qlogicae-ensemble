workspace:
  project:
    selection:
      qlogicae-cor-root:
        filesystem-path:
          value: ${{ qlogicae-cor-root-filesystem-path }}

workflow:
  selection:      
    qlogicae-cor-stage:
      filesystem-path:
        value: ${{ qlogicae-cor-root-filesystem-path }}
    
      scripts:
        - run:
            value: command-template-apply        
          argument:
            targets:
              - qlogicae-cor

        - run:
            value: qlogicae-ensemble-synchronize-backups

macros:
  static:
    file:
      targets:
        qlogicae-cor-root-filesystem-path:
          value: ${{ selection-filesystem-path }}/${{ qlogicae-cor-brand-base-name }}
