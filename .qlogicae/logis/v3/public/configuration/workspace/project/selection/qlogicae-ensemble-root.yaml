workspace:
  project:
    selection:
      qlogicae-ensemble-root:
        filesystem-path:
          value: ${{ qlogicae-ensemble-root-filesystem-path }}

workflow:
  selection:      
    qlogicae-ensemble-stage-release:
      filesystem-path:
        value: ${{ qlogicae-ensemble-root-filesystem-path }}
      
      scripts:
        - run:
            value: command-template-apply        
          argument:
            targets:
              - qlogicae-ensemble
                
        - run:
            value: qlogicae-ensemble-synchronize-backups

    qlogicae-ensemble-synchronize-backups:
      filesystem-path:
        value: ${{ root-filesystem-path }}
      
      scripts:
        - run:
            value: command-filesystem-copy          
          argument:
            source_paths:
              - ${{ root-filesystem-path }}/.qlogicae
            target_paths:
              - ${{ qlogicae-ensemble-root-filesystem-path }}/.qlogicae

macros:
  static:
    file:
      targets:
        qlogicae-ensemble-root-filesystem-path:
          value: ${{ selection-filesystem-path }}/${{ qlogicae-ensemble-brand-base-name }}
