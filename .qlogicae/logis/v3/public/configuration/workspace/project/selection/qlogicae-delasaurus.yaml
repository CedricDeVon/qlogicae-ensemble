macros:  
  static:
    file:
      targets:
        qlogicae-delasaurus-display-brand-name:
          value: ${{ main-company-display-name }} ${{ qlogicae-delasaurus-display-project-name }}

        qlogicae-delasaurus-base-brand-name:
          value: ${{ main-company-base-name }}-${{ qlogicae-delasaurus-base-project-name }}

        qlogicae-delasaurus-display-project-name:
          value: Delasaurus

        qlogicae-delasaurus-base-project-name:
          value: delasaurus

        qlogicae-delasaurus-base-description:
          value: The asset-hosting repository for QLogicae projects

        qlogicae-delasaurus-current-version-number:
          value: 1.0.5

        qlogicae-delasaurus-current-version-label:
          value: v${{ qlogicae-delasaurus-current-version-number }}
