workspace:
  project:
    selection:
      qlogicae-qarta-root:
        filesystem-path:
          value: ${{ qlogicae-qarta-root-filesystem-path }}

workflow:
  selection:      
    qlogicae-qarta-root-pre-workflow:
      filesystem-path:
        value: ${{ qlogicae-qarta-root-filesystem-path }}
    
      scripts:
        - run:
            value: command-template-apply        
          argument:
            targets:
              - qlogicae-qarta

        - run:
            value: qlogicae-ensemble-synchronize

macros:
  static:  
    file:
      targets:
        qlogicae-qarta-root-filesystem-path:
          value: ${{ selection-filesystem-path }}/${{ qlogicae-qarta-brand-base-name }}
