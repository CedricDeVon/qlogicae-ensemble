[project]
name = "${{ qlogicae-cor-brand-base-name }}"
version = "${{ qlogicae-cor-python-version-current-number }}"
description = "${{ qlogicae-cor-base-description }}"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "${{ qlogicae-cor-license-display-name }}"
license-files = [
    "${{ qlogicae-cor-license-filesystem-path }}"
]
authors = [
    { name = "${{ qlogicae-cor-author-full-name }}", email = "${{ qlogicae-cor-author-base-email }}" }
]
maintainers = [
    { name = "${{ qlogicae-cor-author-full-name }}", email = "${{ qlogicae-cor-author-base-email }}" }
]
keywords = [
    "${{ qlogicae-cor-company-base-name }}",
    "${{ qlogicae-cor-base-name }}"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-timeout",
    "pybenchmark",
    "ruff",
    "mypy",
    "hatch",
    "twine",
    "memray",
    "scalene",
    "pympler",
    "vulture",
    "bandit",
    "detect-secrets",
    "pip-audit",   
    "python-minifier"
]

[project.scripts]
qlogicae-cor = "${{ qlogicae-cor-brand-source-name }}.v3.app:main"

[project.urls]
Homepage = "${{ qlogicae-cor-repository-base-link }}"
Repository = "${{ qlogicae-cor-repository-base-link }}"
Documentation = "${{ qlogicae-cor-repository-base-link }}"
Issues = "${{ qlogicae-cor-repository-base-link }}/issues"
Changelog = "${{ qlogicae-cor-repository-base-link }}/releases"


[build-system]
requires = [
    "hatchling"
]
build-backend = "hatchling.build"


[tool.setuptools]
package-dir = {"" = "${{ qlogicae-cor-brand-source-name }}"}


[tool.setuptools.packages.find]
where = ["${{ qlogicae-cor-brand-source-name }}"]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "./test/${{ qlogicae-cor-brand-source-name }}/v3/unit"
]
python_files = ["test_*.py"]
addopts = "-ra"


[tool.coverage.run]
source = [
    "${{ qlogicae-cor-brand-source-name }}.v3.library.singleton_manager",
    "${{ qlogicae-cor-brand-source-name }}.v3.library.macros_manager",
    "${{ qlogicae-cor-brand-source-name }}.v3.library.object_merge_manager",
    "${{ qlogicae-cor-brand-source-name }}.v3.library.value_cache_storage_manager",
    "${{ qlogicae-cor-brand-source-name }}.v3.library.external_dependency_manager",
    "${{ qlogicae-cor-brand-source-name }}.v3.library.enum_conversion_value_enum_manager",
    "${{ qlogicae-cor-brand-source-name }}.v3.library.python_module_manager",
    "${{ qlogicae-cor-brand-source-name }}.v3.library.plugin_manager",
    "${{ qlogicae-cor-brand-source-name }}.v3.library.asynchronous_manager",    
    "${{ qlogicae-cor-brand-source-name }}.v3.library.group_selection_manager",
    "${{ qlogicae-cor-brand-source-name }}.v3.library.placeholder_value_manager",
]
branch = true


[tool.coverage.report]
show_missing = true
skip_covered = false


[tool.mypy]
files = ["${{ qlogicae-cor-brand-source-name }}/v2"]
strict = true
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
show_error_codes = true
pretty = true
color_output = true
show_column_numbers = true
show_error_context = true


[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".output",
    "output",
    ".outputs",
    "outputs",
    ".dist",
    "dist",
    ".build",
    "build",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".tox",
    ".nox",
    ".idea",
    ".vscode",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
skip-magic-trailing-comma = false


[tool.ruff.lint]
select = [    
    "E",
    "W", # pycodestyle    
    "F", # Pyflakes    
    "I", # isort    
    "UP", # pyupgrade    
    "B", # flake8-bugbear
    "PTH", # pathlib
]
ignore = [    
    "S607",    
    "E731",
    "S101", # allow assert statements    
    "S603", # allow subprocess usage
    "PLR2004", # allow magic values
]
fixable = [
    "ALL"
]
unfixable = []


[tool.hatch.build]
include = [
    "${{ qlogicae-cor-brand-source-name }}/**/*.py",
    "${{ qlogicae-cor-brand-source-name }}/py.typed",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "test",
    ".github",
    ".gitignore",
    ".vscode",
    "requirements.txt",
    "output",
    "docs/**",
    "project/**",
]

[tool.hatch.build.targets.wheel.force-include]
"${{ qlogicae-cor-brand-source-name }}/py.typed" = "${{ qlogicae-cor-brand-source-name }}/py.typed"


[tool.hatch.build.targets.wheel]
packages = ["${{ qlogicae-cor-brand-source-name }}"]


[tool.hatch.envs.default.scripts]
test-check-and-apply-format = """
    ruff check ${{ qlogicae-cor-brand-source-name }}/v3 --fix
"""

test-check-and-apply-lint = """
    mypy
"""

test-run-unit = """
    pytest -vv --cov --cov-branch --cov-report=term-missing --cov-report=html:\"${{ qlogicae-cor-python-output-test-unit-filesystem-path }}/html\" --cov-report=xml:\"${{ qlogicae-cor-python-output-test-unit-filesystem-path }}/coverage.xml\" --cov-report=json:\"${{ qlogicae-cor-python-output-test-unit-filesystem-path }}/coverage.json\" --junitxml=\"${{ qlogicae-cor-python-output-test-unit-filesystem-path }}/junit.xml\"
"""

test-run-smoke = """
    pytest -vv test/qlogicae_cor/v3/smoke/test_imports.py
"""

test-run-e2e = """
    ${{ qlogicae-cor-brand-base-name }}
"""

test-check-feature-staleness = """
    vulture ${{ qlogicae-cor-brand-source-name }} 
"""

test-check-dependencies = """
    pip-audit -r requirements.txt
"""

test-check-hardcoded-secrets = """
    detect-secrets scan 
"""

test-check-security = """
    bandit -r ${{ qlogicae-cor-brand-source-name }}
"""

test-check-pip-deployment-build = """
    twine check ${{ qlogicae-cor-python-output-build-release-filesystem-path }}/dist/*
"""

benchmark-create-memray-usage-import-only = """
    memray run -o ${{ qlogicae-cor-python-output-benchmark-filesystem-path }}/usage.import_only.bin -m benchmark.${{ qlogicae-cor-brand-source-name }}.v3.memory.import.usage.import_only --force
"""

benchmark-view-memray-usage-import-only = """
    memray tree ${{ qlogicae-cor-python-output-benchmark-filesystem-path }}/usage.import_only.bin
"""

benchmark-create-memray-usage-import-and-allocate = """
    memray run -o ${{ qlogicae-cor-python-output-benchmark-filesystem-path }}/usage.import_and_allocate.bin -m benchmark.${{ qlogicae-cor-brand-source-name }}.v3.memory.import.usage.import_and_allocate --force
"""

benchmark-view-memray-usage-import-and-allocate = """
    memray tree ${{ qlogicae-cor-python-output-benchmark-filesystem-path }}/usage.import_and_allocate.bin
"""

benchmark-short-library-import-memory-usage = """
    ${{ qlogicae-cor-python-python3-script-filesystem-path }} -m benchmark.${{ qlogicae-cor-brand-source-name }}.v3.tool ${{ qlogicae-cor-brand-source-name }}.v3 --json-output ${{ qlogicae-cor-python-output-benchmark-import-library-memory-usage-filesystem-path }} --repetitions 10
"""

benchmark-long-experiment-import-memory-usage = """
    ${{ qlogicae-cor-python-python3-script-filesystem-path }} -m benchmark.${{ qlogicae-cor-brand-source-name }}.v3.tool benchmark.${{ qlogicae-cor-brand-source-name }}.v3.memory.import.experiment.static_import benchmark.${{ qlogicae-cor-brand-source-name }}.v3.memory.import.experiment.old_dynamic_import benchmark.${{ qlogicae-cor-brand-source-name }}.v3.memory.import.experiment.typeless_with_static_class_import benchmark.${{ qlogicae-cor-brand-source-name }}.v3.memory.import.experiment.typeless_with_dynamic_class_import benchmark.${{ qlogicae-cor-brand-source-name }}.v3.memory.import.experiment.empty_package --json-output ${{ qlogicae-cor-python-output-benchmark-import-experiment-memory-usage-filesystem-path }}/ --repetitions 20
"""

benchmark-long-library-import-memory-usage = """
    ${{ qlogicae-cor-python-python3-script-filesystem-path }} -m benchmark.${{ qlogicae-cor-brand-source-name }}.v3.tool ${{ qlogicae-cor-brand-source-name }}.v1 ${{ qlogicae-cor-brand-source-name }}.v2 ${{ qlogicae-cor-brand-source-name }}.v3 --json-output ${{ qlogicae-cor-python-output-benchmark-import-library-memory-usage-filesystem-path }} --repetitions 20
"""

deploy-build-release = """
    twine upload ${{ qlogicae-cor-python-output-build-release-filesystem-path }}/dist/* --config-file .pypirc
"""

usage-install-release = """
    ${{ qlogicae-cor-python-python3-script-filesystem-path }} -m pip install --force-reinstall ${{ qlogicae-cor-python-output-build-release-filesystem-path }}/dist/*.whl
"""

usage-uninstall-release = """
    ${{ qlogicae-cor-python-python3-script-filesystem-path }} -m pip uninstall -y ${{ qlogicae-cor-python-output-build-release-filesystem-path }}/dist/*.whl
"""
