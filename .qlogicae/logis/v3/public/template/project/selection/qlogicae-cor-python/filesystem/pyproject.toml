[project]
name = "${{ qlogicae-cor-brand-base-name }}"
version = "${{ qlogicae-cor-python-version-current-number }}"
description = "${{ qlogicae-cor-base-description }}"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "${{ qlogicae-cor-license-display-name }}"
license-files = ["${{ qlogicae-cor-license-filesystem-path }}"]
authors = [
    { name = "${{ qlogicae-cor-author-full-name }}", email = "${{ qlogicae-cor-author-base-email }}" }
]
maintainers = [
    { name = "${{ qlogicae-cor-author-full-name }}", email = "${{ qlogicae-cor-author-base-email }}" }
]
keywords = [
    "${{ qlogicae-cor-company-base-name }}", "${{ qlogicae-cor-base-name }}"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-benchmark",
    "ruff",
    "mypy",
    "hatch",
    "twine",
    "memray",
    "scalene",
    "pympler"
]

[project.scripts]
qlogicae-cor = "${{ qlogicae-cor-brand-source-name }}.v2.console.app:main"

[project.urls]
Homepage = "${{ qlogicae-cor-repository-base-link }}"
Repository = "${{ qlogicae-cor-repository-base-link }}"
Documentation = "${{ qlogicae-cor-repository-base-link }}"
Issues = "${{ qlogicae-cor-repository-base-link }}/issues"
Changelog = "${{ qlogicae-cor-repository-base-link }}/releases"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.setuptools]
package-dir = {"" = "${{ qlogicae-cor-brand-source-name }}"}


[tool.setuptools.packages.find]
where = ["${{ qlogicae-cor-brand-source-name }}"]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "./test/${{ qlogicae-cor-brand-source-name }}/v1/unit",
    "./test/${{ qlogicae-cor-brand-source-name }}/v2/unit"
]
python_files = ["test_*.py"]
addopts = "-ra"


[tool.coverage.run]
source = [
    "${{ qlogicae-cor-brand-source-name }}.v1.library.value_cache_storage_manager",
    "${{ qlogicae-cor-brand-source-name }}.v1.library.macros_manager",
    "${{ qlogicae-cor-brand-source-name }}.v1.library.object_merge_manager",
    "${{ qlogicae-cor-brand-source-name }}.v1.library.abstract_manager",
    "${{ qlogicae-cor-brand-source-name }}.v1.library.singleton_manager",
    "${{ qlogicae-cor-brand-source-name }}.v1.library.error_manager",

    "${{ qlogicae-cor-brand-source-name }}.v2.library.value_cache_storage_manager",
    "${{ qlogicae-cor-brand-source-name }}.v2.library.macros_manager",
    "${{ qlogicae-cor-brand-source-name }}.v2.library.object_merge_manager",
    "${{ qlogicae-cor-brand-source-name }}.v2.library.singleton_manager",
]
branch = true


[tool.coverage.report]
show_missing = true
skip_covered = false


[tool.mypy]
files = ["${{ qlogicae-cor-brand-source-name }}/v2"]
strict = true
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
show_error_codes = true
pretty = true
color_output = true
show_column_numbers = true
show_error_context = true


[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".output",
    "output",
    ".outputs",
    "outputs",
    ".dist",
    "dist",
    ".build",
    "build",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".tox",
    ".nox",
    ".idea",
    ".vscode",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
skip-magic-trailing-comma = false


[tool.ruff.lint]
select = [    
    "E",
    "W", # pycodestyle    
    "F", # Pyflakes    
    "I", # isort    
    "UP", # pyupgrade    
    "B", # flake8-bugbear
    "PTH", # pathlib
]
ignore = [    
    "S607",    
    "E731",
    "S101", # allow assert statements    
    "S603", # allow subprocess usage
    "PLR2004", # allow magic values
]
fixable = ["ALL"]
unfixable = []


[tool.hatch.build]
include = [
    "${{ qlogicae-cor-brand-source-name }}/**/*.py",
    "${{ qlogicae-cor-brand-source-name }}/py.typed",
]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
    ".github/**",
    "test/**",
    "docs/**",
    "project/**",
]

[tool.hatch.build.targets.wheel.force-include]
"${{ qlogicae-cor-brand-source-name }}/py.typed" = "${{ qlogicae-cor-brand-source-name }}/py.typed"


[tool.hatch.build.targets.wheel]
packages = ["${{ qlogicae-cor-brand-source-name }}"]


[tool.hatch.envs.default.scripts]
test-lint = """
    ruff check ${{ qlogicae-cor-brand-source-name }}/v2 --fix
"""

test-type-check = """
    mypy
"""

test-unit = """
    pytest -vv \
        --cov \
        --cov-branch \
        --cov-report=term-missing \
        --cov-report=html:\"${{ qlogicae-cor-python-output-test-unit-filesystem-path }}/html\" \
        --cov-report=xml:\"${{ qlogicae-cor-python-output-test-unit-filesystem-path }}/coverage.xml\" \
        --cov-report=json:\"${{ qlogicae-cor-python-output-test-unit-filesystem-path }}/coverage.json\" \
        --junitxml=\"${{ qlogicae-cor-python-output-test-unit-filesystem-path }}/junit.xml\" \
"""

test-pip-deployment = """
    twine check ${{ qlogicae-cor-python-output-build-release-filesystem-path }}/dist/*
"""

deploy = """
    twine upload ${{ qlogicae-cor-python-output-build-release-filesystem-path }}/dist/* --config-file .pypirc
"""



test-benchmark-memory-usage-create = """
    memray run -o ${{ qlogicae-cor-python-output-test-benchmark-filesystem-path }}/memray-1.bin -m test.${{ qlogicae-cor-brand-source-name }}.v1.benchmark.memory_usage.test_imports ;
"""
test-benchmark-memory-usage-view = """
    memray tree ${{ qlogicae-cor-python-output-test-benchmark-filesystem-path }}/memray-1.bin
"""
github-workflow-setup = """
    mkdir -p ${{ qlogicae-cor-python-output-build-release-filesystem-path }} &&
    mkdir -p ${{ qlogicae-cor-python-output-test-unit-filesystem-path }} &&
    mkdir -p ${{ qlogicae-cor-python-output-test-benchmark-filesystem-path }}
"""
github-workflow-test-type-check = """
    hatch run github-workflow-setup &&
    hatch run test-type-check
"""
github-workflow-test-lint = """
    hatch run github-workflow-setup &&
    hatch run test-lint
"""
github-workflow-test-unit = """
    hatch run github-workflow-setup &&
    hatch run test-unit
"""

