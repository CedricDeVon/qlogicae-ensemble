[project]
name = "${{ qlogicae-cor-base-brand-name }}"
version = "${{ qlogicae-cor-python-current-version-number }}"
description = "${{ qlogicae-cor-base-description }}"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "${{ main-author-full-name }}", email = "${{ main-author-base-email }}" }
]
maintainers = [
    { name = "${{ main-author-full-name }}", email = "${{ main-author-base-email }}" }
]
keywords = [
    "${{ main-company-base-name }}", "${{ qlogicae-cor-base-project-name }}"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.13,<3",
    "pyfiglet>=1.0.4,<2",
    "PyYAML>=6.0,<7",
    "qlogicae-cor>=2.0.0,<3",
    "rich>=15,<16",
    "textual>=8,<9",
    "typer>=0.26,<1",
    "tomli_w>=1.2.0,<2",
    "tomlkit>=0.15.0,<1"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-benchmark",
    "ruff",
    "mypy",
    "hatch",
    "twine",
    "memray",
    "scalene",
    "pympler"
]

[project.scripts]
qlogicae-cor = "${{ qlogicae-cor-source-brand-name }}.v2.console.app:main"

[project.urls]
Homepage = "${{ qlogicae-cor-base-repository-link }}"
Repository = "${{ qlogicae-cor-base-repository-link }}"
Documentation = "${{ qlogicae-cor-base-repository-link }}"
Issues = "${{ qlogicae-cor-base-repository-link }}/issues"
Changelog = "${{ qlogicae-cor-base-repository-link }}/releases"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.setuptools]
package-dir = {"" = "${{ qlogicae-cor-source-brand-name }}"}


[tool.setuptools.packages.find]
where = ["${{ qlogicae-cor-source-brand-name }}"]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "./test/${{ qlogicae-cor-source-brand-name }}/v1/unit",
    "./test/${{ qlogicae-cor-source-brand-name }}/v2/unit"
]
python_files = ["test_*.py"]
addopts = "-ra"


[tool.coverage.run]
source = [
    "${{ qlogicae-cor-source-brand-name }}.v1.library.value_cache_storage_manager",
    "${{ qlogicae-cor-source-brand-name }}.v1.library.macros_manager",
    "${{ qlogicae-cor-source-brand-name }}.v1.library.object_merge_manager",
    "${{ qlogicae-cor-source-brand-name }}.v1.library.abstract_manager",
    "${{ qlogicae-cor-source-brand-name }}.v1.library.singleton_manager",
    "${{ qlogicae-cor-source-brand-name }}.v1.library.error_manager",

    "${{ qlogicae-cor-source-brand-name }}.v2.library.value_cache_storage_manager",
    "${{ qlogicae-cor-source-brand-name }}.v2.library.macros_manager",
    "${{ qlogicae-cor-source-brand-name }}.v2.library.object_merge_manager",
    "${{ qlogicae-cor-source-brand-name }}.v2.library.singleton_manager",
]
branch = true


[tool.coverage.report]
show_missing = true
skip_covered = false


[tool.mypy]
files = ["${{ qlogicae-cor-source-brand-name }}"]
strict = true
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
show_error_codes = true
pretty = true
color_output = true
show_column_numbers = true
show_error_context = true


[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".output",
    "output",
    ".outputs",
    "outputs",
    ".dist",
    "dist",
    ".build",
    "build",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".tox",
    ".nox",
    ".idea",
    ".vscode",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
skip-magic-trailing-comma = false


[tool.ruff.lint]
select = [    
    "E",
    "W", # pycodestyle    
    "F", # Pyflakes    
    "I", # isort    
    "UP", # pyupgrade    
    "B", # flake8-bugbear
    "PTH", # pathlib
]
ignore = [    
    "S607",    
    "E731",
    "S101", # allow assert statements    
    "S603", # allow subprocess usage
    "PLR2004", # allow magic values
]
fixable = ["ALL"]
unfixable = []


[tool.hatch.build]
include = [
    "${{ qlogicae-cor-source-brand-name }}/**/*.py",
    "${{ qlogicae-cor-source-brand-name }}/py.typed",
]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
    ".github/**",
    "test/**",
    "docs/**",
    "project/**",
]

[tool.hatch.build.targets.wheel.force-include]
"${{ qlogicae-cor-source-brand-name }}/py.typed" = "${{ qlogicae-cor-source-brand-name }}/py.typed"


[tool.hatch.build.targets.wheel]
packages = ["${{ qlogicae-cor-source-brand-name }}"]


[tool.hatch.envs.default.scripts]
test-lint = """
    ruff check ${{ qlogicae-cor-source-brand-name }} --fix
"""
test-type-check = """
    mypy
"""
test-unit = """
    pytest -vv \
        --cov \
        --cov-branch \
        --cov-report=term-missing \
        --cov-report=html:\"${{ qlogicae-cor-python-output-test-unit-filesystem-path }}/html\" \
        --cov-report=xml:\"${{ qlogicae-cor-python-output-test-unit-filesystem-path }}/coverage.xml\" \
        --cov-report=json:\"${{ qlogicae-cor-python-output-test-unit-filesystem-path }}/coverage.json\" \
        --junitxml=\"${{ qlogicae-cor-python-output-test-unit-filesystem-path }}/junit.xml\" \
"""
test-benchmark-memory-usage-create = """
    memray run -o ${{ qlogicae-cor-python-output-test-benchmark-filesystem-path }}/memray-1.bin -m test.${{ qlogicae-cor-source-brand-name }}.v1.benchmark.memory_usage.test_imports ;
"""
test-benchmark-memory-usage-view = """
    memray tree ${{ qlogicae-cor-python-output-test-benchmark-filesystem-path }}/memray-1.bin
"""
test-pip-deployment = """
    twine check ${{ qlogicae-cor-python-output-build-release-filesystem-path }}/dist/*
"""
deploy = """
    twine upload ${{ qlogicae-cor-python-output-build-release-filesystem-path }}/dist/* --config-file .pypirc
"""



github-workflow-setup = """
    mkdir -p ${{ qlogicae-cor-python-output-build-release-filesystem-path }} &&
    mkdir -p ${{ qlogicae-cor-python-output-test-unit-filesystem-path }} &&
    mkdir -p ${{ qlogicae-cor-python-output-test-benchmark-filesystem-path }}
"""
github-workflow-test-type-check = """
    hatch run github-workflow-setup &&
    hatch run test-type-check
"""
github-workflow-test-lint = """
    hatch run github-workflow-setup &&
    hatch run test-lint
"""
github-workflow-test-unit = """
    hatch run github-workflow-setup &&
    hatch run test-unit
"""

