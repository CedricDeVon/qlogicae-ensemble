[project]
name = "${{ qlogicae-cylon-base-brand-name }}"
version = "${{ qlogicae-cylon-current-version-number }}"
description = "${{ qlogicae-cylon-base-description }}"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "MIT"
license-files = [
    "LICENSE"
]
dependencies = []
keywords = [
    "${{ main-company-base-name }}",
    "${{ qlogicae-cylon-base-project-name }}"
]
classifiers = [
    "Typing :: Typed",
    "Topic :: Utilities",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Software Distribution",
    "Topic :: System :: Systems Administration",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
authors = [
    { name = "${{ main-author-full-name }}", email = "${{ main-author-base-email }}" }
]
maintainers = [
    { name = "${{ main-author-full-name }}", email = "${{ main-author-base-email }}" }
]


[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-benchmark",
    "ruff",
    "mypy",
    "hatch",
    "twine",
    "memray",
    "scalene",
    "pympler",
    "vulture",
    "bandit",
    "detect-secrets",
    "safety",
    "pip-audit",   
    "python-minifier"
]

[project.scripts]
qlogicae-cylon = "${{ qlogicae-cylon-source-brand-name }}.${{ qlogicae-cylon-active-major-version-label }}.console.app:main"


[project.urls]
Homepage = "${{ qlogicae-cylon-base-repository-link }}"
Repository = "${{ qlogicae-cylon-base-repository-link }}"
Documentation = "${{ qlogicae-cylon-base-repository-link }}"
Issues = "${{ qlogicae-cylon-base-repository-link }}/issues"
Changelog = "${{ qlogicae-cylon-base-repository-link }}/releases"


[build-system]
requires = [
    "hatchling"
]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = [
    "."
]
python_files = [
    "test_*.py"
]
addopts = "-ra"


[tool.coverage.run]
source = []
branch = true


[tool.hatch.build]
include = [
    "${{ qlogicae-cylon-source-brand-name }}/**/*",
    "${{ qlogicae-cylon-source-brand-name }}/py.typed",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "test",
    ".github",
    ".gitignore",
    ".vscode",
    "requirements.txt",
    "output",
    "docs/**",
    "project/**",
]


[tool.coverage.report]
show_missing = true
skip_covered = false


[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".output",
    "output",
    ".outputs",
    "outputs",
    ".dist",
    "dist",
    ".build",
    "build",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".tox",
    ".nox",
    ".idea",
    ".vscode",
    "${{ qlogicae-cylon-source-brand-name }}/${{ qlogicae-cylon-active-major-version-label }}/_vendor",
]


[tool.ruff.lint]
select = [    
    "E",
    "W", # pycodestyle    
    "F", # Pyflakes    
    "I", # isort    
    "UP", # pyupgrade    
    "B", # flake8-bugbear
    "PTH", # pathlib
]
ignore = [        
    "E731",
    "B008",
    "S607",    
    "S101", # allow assert statements    
    "S603", # allow subprocess usage
    "PLR2004", # allow magic values
]
fixable = [
    "ALL"
]
unfixable = []


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
skip-magic-trailing-comma = false


[tool.mypy]
files = [
    "${{ qlogicae-cylon-source-brand-name }}/${{ qlogicae-cylon-active-major-version-label }}",
]
exclude = [
    '(^|/)_vendor(/|$)',
]
strict = true
pretty = true
color_output = true
python_version = "3.12"
show_error_codes = true
show_error_context = true
namespace_packages = true
show_column_numbers = true
explicit_package_bases = true


[[tool.mypy.overrides]]
module = [
    "${{ qlogicae-cylon-source-brand-name }}.${{ qlogicae-cylon-active-major-version-label }}._vendor.*",
]
ignore_errors = true


[tool.vulture]
exclude = [
    
]

# "${{ qlogicae-cylon-source-brand-name }}/${{ qlogicae-cylon-active-major-version-label }}/_vendor/qlogicae_cor/v2/library/log_format.py",
# "${{ qlogicae-cylon-source-brand-name }}/${{ qlogicae-cylon-active-major-version-label }}/_vendor/qlogicae_cor/v2/library/timestamp_manager.py",


[tool.hatch.build.targets.wheel]
packages = [
    "${{ qlogicae-cylon-source-brand-name }}"
]


[tool.hatch.build.targets.wheel.force-include]
"${{ qlogicae-cylon-source-brand-name }}/py.typed" = "${{ qlogicae-cylon-source-brand-name }}/py.typed"


[tool.hatch.envs.default.scripts]
