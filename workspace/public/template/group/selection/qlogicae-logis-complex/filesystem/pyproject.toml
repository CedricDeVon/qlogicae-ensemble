[project]
name = "${{ qlogicae-logis-base-brand-name }}"
version = "${{ qlogicae-logis-current-version-number }}"
description = "${{ qlogicae-logis-base-description }}"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "${{ main-author-full-name }}", email = "${{ main-author-base-email }}" }
]
maintainers = [
    { name = "${{ main-author-full-name }}", email = "${{ main-author-base-email }}" }
]
keywords = ["${{ main-company-base-name }}", "${{ qlogicae-logis-base-project-name }}"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Software Distribution",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "pydantic>=2.13,<3",
    "pyfiglet>=1.0.4,<2",
    "PyYAML>=6.0,<7",
    "qlogicae-cor>=1.0.8,<2",
    "rich>=15,<16",
    "textual>=8,<9",
    "typer>=0.26,<1",
    "tomli_w>=1.2.0,<2",
    "tomlkit>=0.15.0,<1"
]


[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-benchmark",
    "ruff",
    "mypy",
    "hatch",
    "twine",
    "memray",
    "scalene",
    "pympler"
]

[project.scripts]
qlogicae-logis = "${{ qlogicae-logis-source-brand-name }}.v1.cli.app:main"


[project.urls]
Homepage = "${{ qlogicae-logis-base-repository-link }}"
Repository = "${{ qlogicae-logis-base-repository-link }}"
Documentation = "${{ qlogicae-logis-base-repository-link }}"
Issues = "${{ qlogicae-logis-base-repository-link }}/issues"
Changelog = "${{ qlogicae-logis-base-repository-link }}/releases"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["./test/${{ qlogicae-logis-source-brand-name }}/v1/unit"]
python_files = ["test_*.py"]
addopts = "-ra"


[tool.coverage.run]
source = [
    "${{ qlogicae-logis-source-brand-name }}.v1.value_cache_storage_manager",
    "${{ qlogicae-logis-source-brand-name }}.v1.macros_manager",
    "${{ qlogicae-logis-source-brand-name }}.v1.object_merge_manager",
]
branch = true


[tool.hatch.build]
include = [
    "LICENSE",
    "README.md",
    "SECURITY.md",
    "project/**/*",
    "qlogicae_logis/**/*",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "test",
    ".github",
    ".gitignore",
    ".vscode",
    "requirements.txt",
    "output",
]

[tool.coverage.report]
show_missing = true
skip_covered = false


[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".output",
    "output",
    ".outputs",
    "outputs",
    ".dist",
    "dist",
    ".build",
    "build",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".tox",
    ".nox",
    ".idea",
    ".vscode",
]

[tool.ruff.lint]
select = [    
    "E",
    "W", # pycodestyle    
    "F", # Pyflakes    
    "I", # isort    
    "UP", # pyupgrade    
    "B", # flake8-bugbear
    "PTH", # pathlib
]
ignore = [    
    "B008",
    "S607",    
    "S101", # allow assert statements    
    "S603", # allow subprocess usage
    "PLR2004", # allow magic values
]
fixable = ["ALL"]
unfixable = []


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
skip-magic-trailing-comma = false


[tool.hatch.envs.default.scripts]
lint = """
    ruff check ${{ qlogicae-logis-source-brand-name }} --fix
"""
test-unit = """
    pytest -vv \
        --cov \
        --cov-branch \
        --cov-report=term-missing \
        --cov-report=html:\"${{ qlogicae-logis-output-test-unit-relative-path }}/html\" \
        --cov-report=xml:\"${{ qlogicae-logis-output-test-unit-relative-path }}/coverage.xml\" \
        --cov-report=json:\"${{ qlogicae-logis-output-test-unit-relative-path }}/coverage.json\" \
        --junitxml=\"${{ qlogicae-logis-output-test-unit-relative-path }}/junit.xml\" \
"""
test-benchmark-memory-usage-create = """
    scalene run --html --outfile ${{ qlogicae-logis-output-test-benchmark-relative-path }}/scalene.html test/qlogicae_logis/v1/benchmark/test_full_setup_memory_usage.py ;
    memray run -o ${{ qlogicae-logis-output-test-benchmark-relative-path }}/memray.bin -m test.qlogicae_logis.v1.benchmark.test_full_setup_memory_usage
"""
test-benchmark-memory-usage-view = """
    scalene view ${{ qlogicae-logis-output-test-benchmark-relative-path }}/scalene.json
    memray tree ${{ qlogicae-logis-output-test-benchmark-relative-path }}/memray.bin
"""
test-pip-deployment = """
    twine check ${{ qlogicae-logis-output-build-release-relative-path }}/dist/*
"""
deploy = """
    twine upload ${{ qlogicae-logis-output-build-release-relative-path }}/dist/* --config-file .pypirc
"""


github-workflow-setup = """
    mkdir -p ${{ qlogicae-logis-output-build-release-relative-path }} &&
    mkdir -p ${{ qlogicae-logis-output-test-unit-relative-path }} &&
    mkdir -p ${{ qlogicae-logis-output-test-benchmark-relative-path }}
"""
github-workflow-lint = """
    hatch run github-workflow-setup &&
    hatch run lint
"""
github-workflow-test-unit = """
    hatch run github-workflow-setup &&
    hatch run test-unit
"""
github-workflow-test-benchmark-memory-usage-create = """
    hatch run github-workflow-setup &&
    hatch run test-benchmark-memory-usage-create
"""
github-workflow-test-benchmark-memory-usage-view = """
    hatch run github-workflow-setup &&
    hatch run test-benchmark-memory-usage-view
"""




workflow-deploy = """
    hatch run build &&
    hatch run typecheck &&
    hatch run lint &&
    hatch run format &&
    twine upload ./output/build/* --config-file .pypirc --verbose
"""
