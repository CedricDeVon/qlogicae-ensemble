
data:
  selection:
    is-enabled: true

    default:
      name: root
      targets:
        all:
          full-path: ${{ current-root-full-path }}

        root:
          full-path: ${{ current-root-full-path }}

        project:
          full-path: ${{ current-root-full-path }}

    project:
      targets:
        qlogicae-upkeep:
          full-path: ${{ current-root-selection-full-path }}/qlogicae-upkeep

        qlogicae-delasaurus:
          full-path: ${{ current-root-selection-full-path }}/qlogicae-delasaurus

        qlogicae-scaf:
          full-path: ${{ current-root-selection-full-path }}/qlogicae-scaf

        qlogicae-logis:
          full-path: ${{ current-root-selection-full-path }}/qlogicae-logis

        qlogicae-cor:
          full-path: ${{ current-root-selection-full-path }}/qlogicae-cor

        qlogicae-cor-typescript:
          full-path: ${{ current-root-selection-full-path }}/qlogicae-cor/typescript

        qlogicae-cor-python:
          full-path: ${{ current-root-selection-full-path }}/qlogicae-cor/python

        qlogicae-cor-rust:
          full-path: ${{ current-root-selection-full-path }}/qlogicae-cor/rust

        qlogicae-pondux:
          full-path: ${{ current-root-selection-full-path }}/qlogicae-pondux

  script:
    is-enabled: true    
    process: shell
    is-process-override-enabled: false

    targets:      
      value-cache-debug:
        enter-full-path: ${{ current-root-full-path }}/workspace/public/toolset/qlogicae-logis
        commands:
          - run: "python3 -c \"
              from qlogicae_logis.v1 import workspace_manager;
              workspace_manager.singleton.debug_value_cache();\""
            is-enabled: true

      qlogicae-ensemble-deploy:
        enter-full-path: ${{ current-root-full-path }}
        commands:
          - run: git add .
          - run: git commit -m "deployment attempt"
          - run: git tag ${{ qlogicae-ensemble-current-version-label }}
          - run: git push
          - run: git push --tags

      qlogicae-upkeep-deploy:
        enter-full-path: ${{ current-root-selection-full-path }}/qlogicae-upkeep
        commands:
          - run: git add .
          - run: git commit -m "deployment attempt"
          - run: git tag ${{ qlogicae-upkeep-current-version-label }}
          - run: git push
          - run: git push --tags

      qlogicae-delasaurus-deploy:
        enter-full-path: ${{ current-root-selection-full-path }}/qlogicae-delasaurus
        commands:
          - run: git add .
          - run: git commit -m "deployment attempt"
          - run: git tag ${{ qlogicae-delasaurus-current-version-label }}
          - run: git push
          - run: git push --tags

      qlogicae-scaf-deploy:
        enter-full-path: ${{ current-root-selection-full-path }}/qlogicae-scaf
        commands:
          - run: git add .
          - run: git commit -m "deployment attempt"
          - run: git tag ${{ qlogicae-scaf-current-version-label }}
          - run: git push
          - run: git push --tags

      qlogicae-logis-deploy:
        enter-full-path: ${{ current-root-selection-full-path }}/qlogicae-logis
        commands:
          - run: git add .
          - run: git commit -m "deployment attempt"
          - run: git tag ${{ qlogicae-logis-current-version-label }}
          - run: git push
          - run: git push --tags

      qlogicae-cor-deploy:
        enter-full-path: ${{ current-root-selection-full-path }}/qlogicae-cor
        commands:
          - run: git add .
          - run: git commit -m "deployment attempt"
          - run: git push
          - run: git push --tags

      qlogicae-cor-typescript-deploy:
        enter-full-path: ${{ current-root-selection-full-path }}/qlogicae-cor/typescript
        commands:
          - run: bun run workflow:deploy
          - run: qlogicae-cor-deploy

      qlogicae-cor-python-deploy:
        enter-full-path: ${{ current-root-selection-full-path }}/qlogicae-cor/python
        commands:
          - run: git add .
          - run: git commit -m "deployment attempt"
          - run: git tag ${{ qlogicae-cor-python-current-version-label }}
          - run: qlogicae-cor-deploy

      qlogicae-cor-rust-deploy:
        enter-full-path: ${{ current-root-selection-full-path }}/qlogicae-cor/rust
        commands:
          - run: cargo build-release
          - run: cargo workflow-deploy
          - run: git add .
          - run: git commit -m "deployment attempt"
          - run: git tag ${{ qlogicae-cor-rust-current-version-label }}
          - run: qlogicae-cor-deploy

      qlogicae-pondux-deploy:
        enter-full-path: ${{ current-root-selection-full-path }}/qlogicae-pondux
        commands:
          - run: bun run workflow:deploy

    clean:
      is-enabled: true

      exclude:
        targets:
          - name: ${{ current-root-full-path }}
          - name: ${{ current-root-selection-full-path }}
          - name: ${{ current-root-selection-full-path }}/qlogicae-upkeep         
          - name: ${{ current-root-selection-full-path }}/qlogicae-delasaurus         
          - name: ${{ current-root-selection-full-path }}/qlogicae-scaf         
          - name: ${{ current-root-selection-full-path }}/qlogicae-logis         
          - name: ${{ current-root-selection-full-path }}/qlogicae-cor
          - name: ${{ current-root-selection-full-path }}/qlogicae-pondux
          - name: ${{ current-root-full-path }}/workspace
          - name: ${{ current-root-full-path }}/.github  
          - name: ${{ current-root-full-path }}/.temporary   

      include:
        targets:
          root:
            - name: ${{ current-root-full-path }}/workspace/private/temporary/intermediate

  time:
    zone: utc

  log:
    is-enabled: true
    is-override-enabled: false
    is-verbose-enabled: true
    is-verbose-override-enabled: false

    file:
      is-enabled: true
      is-verbose-enabled: true
      targets:
        - name: ${{ current-root-full-path }}/workspace/private/temporary/log/${{ current-date }}.log            

    console:
      is-enabled: true
      is-verbose-enabled: false

  macros:  
    value-cache:
      targets:
        - name: current-date
        - name: current-year
        - name: current-root-full-path
        - name: current-root-selection-full-path

    file:
      targets:
        - name: main-author-full-name
          value: Vaughn Cedric L. Araneta

        - name: main-author-base-email
          value: vaughncedriclipardoaraneta@gmail.com
        
        - name: main-company-display-name
          value: QLogicae

        - name: main-company-base-name
          value: qlogicae
        
        - name: main-company-base-logo-filesystem-path
          value: ./project/asset/${{ main-company-base-name }}1.png



        - name: qlogicae-ensemble-display-brand-name
          value: ${{ main-company-display-name }} ${{ qlogicae-ensemble-display-project-name }}

        - name: qlogicae-ensemble-display-brand-name
          value: ${{ main-company-display-name }} ${{ qlogicae-ensemble-display-project-name }}

        - name: qlogicae-ensemble-base-brand-name
          value: ${{ main-company-base-name }}-${{ qlogicae-ensemble-base-project-name }}

        - name: qlogicae-ensemble-display-project-name
          value: Ensemble

        - name: qlogicae-ensemble-base-project-name
          value: ensemble

        - name: qlogicae-ensemble-base-description
          value: The QLogicae workspace

        - name: qlogicae-ensemble-current-version-number
          value: 1.0.1

        - name: qlogicae-ensemble-current-version-label
          value: v${{ qlogicae-ensemble-current-version-number }}



        - name: qlogicae-upkeep-display-brand-name
          value: ${{ main-company-display-name }} ${{ qlogicae-upkeep-display-project-name }}

        - name: qlogicae-upkeep-display-brand-name
          value: ${{ main-company-display-name }} ${{ qlogicae-upkeep-display-project-name }}

        - name: qlogicae-upkeep-base-brand-name
          value: ${{ main-company-base-name }}-${{ qlogicae-upkeep-base-project-name }}

        - name: qlogicae-upkeep-display-project-name
          value: Upkeep

        - name: qlogicae-upkeep-base-project-name
          value: upkeep

        - name: qlogicae-upkeep-base-description
          value: The personal budget application for V.C.A., deployed via Google's Looker Studio

        - name: qlogicae-upkeep-current-version-number
          value: 1.5.8

        - name: qlogicae-upkeep-current-version-label
          value: v${{ qlogicae-upkeep-current-version-number }}

        - name: qlogicae-upkeep-looker-studio-link
          value: https://datastudio.google.com/s/irbNNcZBEjw



        - name: qlogicae-delasaurus-display-brand-name
          value: ${{ main-company-display-name }} ${{ qlogicae-delasaurus-display-project-name }}

        - name: qlogicae-delasaurus-base-brand-name
          value: ${{ main-company-base-name }}-${{ qlogicae-delasaurus-base-project-name }}

        - name: qlogicae-delasaurus-display-project-name
          value: Delasaurus

        - name: qlogicae-delasaurus-base-project-name
          value: delasaurus

        - name: qlogicae-delasaurus-base-description
          value: The asset-hosting repository for QLogicae projects

        - name: qlogicae-delasaurus-current-version-number
          value: 1.0.5

        - name: qlogicae-delasaurus-current-version-label
          value: v${{ qlogicae-delasaurus-current-version-number }}



        - name: qlogicae-scaf-display-brand-name
          value: ${{ main-company-display-name }} ${{ qlogicae-scaf-display-project-name }}

        - name: qlogicae-scaf-base-brand-name
          value: ${{ main-company-base-name }}-${{ qlogicae-scaf-base-project-name }}

        - name: qlogicae-scaf-display-project-name
          value: Scaf

        - name: qlogicae-scaf-base-project-name
          value: scaf

        - name: qlogicae-scaf-base-description
          value: The github project template for QLogicae projects

        - name: qlogicae-scaf-current-version-number
          value: 1.1.4

        - name: qlogicae-scaf-current-version-label
          value: v${{ qlogicae-scaf-current-version-number }}


        
        - name: qlogicae-logis-display-brand-name
          value: ${{ main-company-display-name }} ${{ qlogicae-logis-display-project-name }}

        - name: qlogicae-logis-base-brand-name
          value: ${{ main-company-base-name }}-${{ qlogicae-logis-base-project-name }}

        - name: qlogicae-logis-display-project-name
          value: Logis

        - name: qlogicae-logis-base-project-name
          value: logis

        - name: qlogicae-logis-base-description
          value: The project management tool for QLogicae projects

        - name: qlogicae-logis-current-version-number
          value: 1.0.2

        - name: qlogicae-logis-current-version-label
          value: v${{ qlogicae-logis-current-version-number }}

        - name: qlogicae-logis-base-repository-link
          value: https://github.com/CedricDeVon/qlogicae-logis



        - name: qlogicae-cor-display-brand-name
          value: ${{ main-company-display-name }} ${{ qlogicae-cor-display-project-name }}

        - name: qlogicae-cor-base-brand-name
          value: ${{ main-company-base-name }}-${{ qlogicae-cor-base-project-name }}

        - name: qlogicae-cor-display-project-name
          value: Cor

        - name: qlogicae-cor-base-project-name
          value: cor

        - name: qlogicae-cor-base-description
          value: The core library for QLogicae projects

        - name: qlogicae-cor-typescript-current-version-number
          value: 1.2.17

        - name: qlogicae-cor-typescript-current-version-label
          value: typescript-v${{ qlogicae-cor-typescript-current-version-number }}

        - name: qlogicae-cor-python-current-version-number
          value: 1.0.9

        - name: qlogicae-cor-python-current-version-label
          value: python-v${{ qlogicae-cor-python-current-version-number }}

        - name: qlogicae-cor-rust-current-version-number
          value: 1.0.3

        - name: qlogicae-cor-rust-current-version-label
          value: rust-v${{ qlogicae-cor-rust-current-version-number }}

        - name: qlogicae-cor-base-repository-link
          value: https://github.com/CedricDeVon/qlogicae-cor


        
        - name: qlogicae-pondux-display-brand-name
          value: ${{ main-company-display-name }} ${{ qlogicae-pondux-display-project-name }}

        - name: qlogicae-pondux-base-brand-name
          value: ${{ main-company-base-name }}-${{ qlogicae-pondux-base-project-name }}

        - name: qlogicae-pondux-display-project-name
          value: Pondux

        - name: qlogicae-pondux-base-project-name
          value: pondux

        - name: qlogicae-pondux-base-description
          value: The cli for QLogicae projects

        - name: qlogicae-pondux-current-version-number
          value: 0.1.7

        - name: qlogicae-pondux-current-version-label
          value: v${{ qlogicae-pondux-current-version-number }}

