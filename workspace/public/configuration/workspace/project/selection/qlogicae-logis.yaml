data:
  selection:
    project:
      targets:
        qlogicae-logis:
          full-path: ${{ qlogicae-logis-selection-project-full-path }}

  workflow:
    selection:      
      qlogicae-logis-cleanup:
        enter-full-path:
          value: ${{ qlogicae-logis-selection-project-full-path }}

        commands:
          - run:
              value: command-filesystem-clean-path
            argument:
              target_paths:
                - dist
                - output

      qlogicae-logis-setup:
        enter-full-path:
          value: ${{ current-root-full-path }}

        commands:
          - run:
              value: command-filesystem-clean-path
            argument:
              target_paths:
                - ${{ qlogicae-logis-selection-project-full-path }}/dist
                - ${{ qlogicae-logis-selection-project-full-path }}/output
                - ${{ qlogicae-logis-selection-project-full-path }}/test
                - ${{ qlogicae-logis-selection-project-full-path }}/qlogicae_logis

          - run:
              value: command-template-apply        
            argument:
              targets:
                - qlogicae-logis-complex

          - run:
              value: command-filesystem-copy          
            argument:
              source_path: qlogicae_logis
              target_paths:
                - ${{ qlogicae-logis-selection-project-full-path }}/qlogicae_logis

          - run:
              value: command-filesystem-copy          
            argument:
              source_path: test
              target_paths:
                - ${{ qlogicae-logis-selection-project-full-path }}/test

          - run:
              value: command-filesystem-tree-setup          
            argument:
              target_paths:
                - ${{ qlogicae-logis-selection-project-full-path }}/archive
                - ${{ qlogicae-logis-selection-project-full-path }}/${{ qlogicae-logis-output-build-release-relative-path }}
                - ${{ qlogicae-logis-selection-project-full-path }}/${{ qlogicae-logis-output-test-unit-relative-path }}
                - ${{ qlogicae-logis-selection-project-full-path }}/${{ qlogicae-logis-output-test-benchmark-relative-path }}


      qlogicae-logis-archive:
        enter-full-path:
          value: ${{ qlogicae-logis-selection-project-full-path }}
          
        commands:          
          - run:
              value: command-filesystem-move         
            argument:
              source_path: output
              target_path: ${{ qlogicae-logis-archive-relative-path }}


      qlogicae-logis-lint:
        enter-full-path:
          value: ${{ qlogicae-logis-selection-project-full-path }}
          
        commands:
          - run:
              value: hatch run lint
              

      qlogicae-logis-test-unit:
        enter-full-path:
          value: ${{ qlogicae-logis-selection-project-full-path }}
          
        commands:
          - run:
              value: hatch run test-unit        


      qlogicae-logis-test-benchmark-memory-usage-create:
        enter-full-path:
          value: ${{ qlogicae-logis-selection-project-full-path }}
          
        commands:
          - run:
              value: hatch run test-benchmark-memory-usage-create


      qlogicae-logis-test-benchmark-memory-usage-view:
        enter-full-path:
          value: ${{ qlogicae-logis-selection-project-full-path }}
          
        commands:
          - run:
              value: hatch run test-benchmark-memory-usage-view      
            
          - run:
              value: command-filesystem-move        
            argument:
              source_path: scalene-profile.html
              target_path: ${{ qlogicae-logis-output-test-benchmark-relative-path }}/scalene-profile.html


      qlogicae-logis-build:
        enter-full-path:
          value: ${{ qlogicae-logis-selection-project-full-path }}
          
        commands:
          - run:
              value: hatch build

          - run:
              value: command-filesystem-move       
            argument:
              source_path: dist
              target_path: ${{ qlogicae-logis-output-build-release-relative-path }}


      qlogicae-logis-test-pip-deployment:
        enter-full-path:
          value: ${{ qlogicae-logis-selection-project-full-path }}
          
        commands:
          - run:
              value: hatch run test-pip-deployment


      qlogicae-logis-pip-deployment:
        enter-full-path:
          value: ${{ qlogicae-logis-selection-project-full-path }}
          
        commands:
          - run:
              value: hatch run deploy

          - run:
              value: qlogicae-logis-git-deployment


      qlogicae-logis-git-deployment:
        enter-full-path:
          value: ${{ qlogicae-logis-selection-project-full-path }}
          
        commands:
          - run:
              value: git add .

          - run:
              value: git commit -m "deployment attempt of '${{ qlogicae-logis-current-version-label }}'"
          
          - run:
              value: git tag -a ${{ qlogicae-logis-current-version-label }} -m "deployment attempt of '${{ qlogicae-logis-current-version-label }}'"
          
          - run:
              value: git push
          
          - run:
              value: git push --tags


      qlogicae-logis:
        enter-full-path:
          value: ${{ qlogicae-logis-selection-project-full-path }}
          
        commands:
          - run:
              value: qlogicae-logis-setup

          - run:
              value: qlogicae-logis-lint

          - run:
              value: qlogicae-logis-test-unit

          - run:
              value: qlogicae-logis-test-benchmark-memory-usage-create

          # - run:
          #     value: qlogicae-logis-test-benchmark-memory-usage-view

          - run:
              value: qlogicae-logis-build
              
          - run:
              value: qlogicae-logis-test-pre-deployment

          - run:
              value: qlogicae-logis-pip-deployment          

          - run:
              value: qlogicae-logis-archive

          - run:
              value: qlogicae-logis-cleanup


  macros:  
    file:
      targets:
        qlogicae-logis-display-brand-name:
          value: ${{ main-company-display-name }} ${{ qlogicae-logis-display-project-name }}

        qlogicae-logis-base-brand-name:
          value: ${{ main-company-base-name }}-${{ qlogicae-logis-base-project-name }}

        qlogicae-logis-source-brand-name:
          value: ${{ main-company-base-name }}_${{ qlogicae-logis-base-project-name }}

        qlogicae-logis-display-project-name:
          value: Logis

        qlogicae-logis-base-project-name:
          value: logis

        qlogicae-logis-base-description:
          value: The project orchestration tool for QLogicae projects

        qlogicae-logis-current-version-number:
          value: 1.1.14

        qlogicae-logis-current-version-label:
          value: v${{ qlogicae-logis-current-version-number }}

        qlogicae-logis-base-repository-link:
          value: https://github.com/CedricDeVon/${{ qlogicae-logis-base-brand-name }}

        qlogicae-logis-selection-project-full-path:
          value: ${{ current-root-selection-full-path }}/${{ qlogicae-logis-base-brand-name }}

        qlogicae-logis-archive-relative-path:
          value: archive/${{ qlogicae-logis-current-version-label }}/${{ current-timestamp }}

        qlogicae-logis-output-relative-path:
          value: output

        qlogicae-logis-output-build-release-relative-path:
          value: ${{ qlogicae-logis-output-relative-path }}/build/release

        qlogicae-logis-output-test-unit-relative-path:
          value: ${{ qlogicae-logis-output-relative-path }}/test/unit

        qlogicae-logis-output-test-benchmark-relative-path:
          value: ${{ qlogicae-logis-output-relative-path }}/test/benchmark

metadata:
