data:
  selection:
    project:
      targets:
        qlogicae-ensemble:
          full-path: ${{ qlogicae-ensemble-selection-project-full-path }}

  workflow:
    is-enabled:
      value: true

    selection:      
      qlogicae-ensemble-build:
        enter-full-path:
          value: ${{ current-root-full-path }}

        commands:
          - run:
              value: command-template-apply        
            argument:
              targets:
                - ${{ qlogicae-ensemble-base-brand-name }}

          - run:
              value: command-filesystem-copy          
            argument:
              source_path: ${{ current-root-full-path }}/workspace
              target_paths:
                - ${{ qlogicae-ensemble-selection-project-full-path }}/workspace


      qlogicae-ensemble-git-deployment:
        enter-full-path:
          value: ${{ qlogicae-ensemble-selection-project-full-path }}

        commands:
          - run:
              value: git add .

          - run:
              value: git commit -m "'workspace' content sync"

          # - run:
          #     value: git commit -m "deployment attempt of '${{ qlogicae-ensemble-current-version-label }}'"

          # - run:
          #     value: git tag -a ${{ qlogicae-ensemble-current-version-label }} -m "deployment attempt of '${{ qlogicae-ensemble-current-version-label }}'"

          - run:
              value: git push

          - run:
              value: git push --tags
  

      qlogicae-ensemble:
        enter-full-path:
          value: ${{ qlogicae-ensemble-selection-project-full-path }}

        commands:
          - run:
              value: qlogicae-ensemble-build

          - run:
              value: qlogicae-ensemble-git-deployment

  macros:  
    file:
      targets:
        qlogicae-ensemble-display-brand-name:
          value: ${{ main-company-display-name }} ${{ qlogicae-ensemble-display-project-name }}

        qlogicae-ensemble-base-brand-name:
          value: ${{ main-company-base-name }}-${{ qlogicae-ensemble-base-project-name }}

        qlogicae-ensemble-display-project-name:
          value: Ensemble

        qlogicae-ensemble-base-project-name:
          value: ensemble

        qlogicae-ensemble-base-description:
          value: The QLogicae workspace

        qlogicae-ensemble-current-version-number:
          value: 1.1.0

        qlogicae-ensemble-current-version-label:
          value: v${{ qlogicae-ensemble-current-version-number }}

        qlogicae-ensemble-selection-project-full-path:
          value: ${{ current-root-selection-full-path }}/${{ qlogicae-ensemble-base-brand-name }}

metadata:
