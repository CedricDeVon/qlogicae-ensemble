  workflow:
    is-enabled:
      value: true

    selection:      
      qlogicae-ensemble-build:
        enter-full-path:
          value: ${{ current-root-full-path }}

        commands:
          - run:
              value: "cp -r ${{ current-root-full-path }}/workspace ${{ current-root-full-path }}/selection/qlogicae-ensemble/workspace"
              

      qlogicae-logis-build:
        enter-full-path:
          value: ${{ current-root-full-path }}

        commands:
          - run:
              value: command-template-apply

            argument:
              targets:
                - qlogicae-logis-complex

          - run:
              value: "cp -r ${{ current-root-full-path }}/qlogicae_logis ${{ current-root-full-path }}/selection/qlogicae-logis/qlogicae_logis"
              
          - run:
              value: "cp -r ${{ current-root-full-path }}/test ${{ current-root-full-path }}/selection/qlogicae-logis/test"
            


      value-cache-debug:
        is-enabled:
          value: true

        delay:
          value: 0

        process:
          value: shell
          override: false
    
        enter-full-path:
          value: ${{ current-root-full-path }}

        commands:
          - run:
              value: command-template-apply

            argument:
              targets:
                - all

            is-enabled:
              value: true

            process:
              value: subprocess

            delay:
              value: 2

          - run:
              value: "python3 -c \"
                from qlogicae_logis.v1 import workspace_manager;
                workspace_manager.singleton.debug_value_cache();\""



