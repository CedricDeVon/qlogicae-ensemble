    # console:
      # is-enabled:
      #   value: true

      # is-verbose: 
      #   value: false

  macros:  
    file:
      targets:
        main-author-full-name:
          value: Vaughn Cedric L. Araneta

        main-author-base-email:
          value: vaughncedriclipardoaraneta@gmail.com
        
        main-company-display-name:
          value: QLogicae

        main-company-base-name:
          value: qlogicae
        
        main-company-base-logo-filesystem-path:
          value: ./project/asset/${{ main-company-base-name }}1.png

