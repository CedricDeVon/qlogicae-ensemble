data:
  selection:
    # is-enabled:
    #   value: true
    #   is-override: false

  script:
    # is-enabled:
    #   value: true
    #   is-override: false

    # process:
    #   value: shell
    #   is-override: false

    # delay:
    #   value: 1

    targets:      
      value-cache-debug:
        # is-enabled:
        #   value: true
        #   is-override: false
        enter-full-path: ${{ current-root-full-path }}/workspace/public/toolset/qlogicae-logis
        commands:
          - run: "python3 -c \"
              from qlogicae_logis.v1 import workspace_manager;
              workspace_manager.singleton.debug_value_cache();\""

            # is-enabled:
            #   value: false
            
            # process:
            #   value: subprocess

            # delay:
            #   value: 1      

    clean:
      # is-enabled:
      #   value: true

      exclude:
        targets:
          - full-path: ${{ current-root-full-path }}/other
          - full-path: ${{ current-root-full-path }}/.github  

      include:
        targets:
          root:
            - full-path: ${{ current-root-full-path }}/workspace/private/temporary/intermediate

  # time:
  #   zone:
  #     value: utc

  # log:
    # is-enabled:
